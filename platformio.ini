[platformio]
default_envs = daisy_seed

[env:daisy_seed]
platform = ststm32
board = electrosmith_daisy
framework = stm32cube
lib_ldf_mode = deep

board_build.mcu = stm32h750ibk6
board_build.f_cpu = 480000000L
; Daisy bootloader, APP_TYPE = BOOT_SRAM (lib/libDaisy/core/Makefile:229).
; .text/.rodata → SRAM (480K), .data/.bss → DTCMRAM (128K), DMA → RAM_D2_DMA.
board_build.ldscript = lib/libDaisy/core/STM32H750IB_sram.lds
board_build.stm32cube.custom_config_header = yes

; Without these PlatformIO keeps checking against the board manifest's internal
; flash (128K) and aborts. Real limits under BOOT_SRAM: code in SRAM (512K-32K),
; .data/.bss in DTCMRAM (128K) — see the MEMORY block of the linker script.
board_upload.maximum_size = 491520
board_upload.maximum_ram_size = 131072

; The app lives in QSPI at 0x90040000 and is uploaded through the Daisy
; bootloader's 2.5 s grace window after reset (hold BOOT to extend it).
upload_protocol = custom
upload_command = "$PROJECT_PACKAGES_DIR/tool-dfuutil/bin/dfu-util.exe" -a 0 -s 0x90040000:leave -D "$BUILD_DIR/${PROGNAME}.bin" -d ,0483:df11

platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.120301.0

extra_scripts =
    pre:link_cmsis_dsp.py
    supplimental_linker_script.py

; -fno-math-errno lets sqrtf/fabsf compile to single FPU instructions instead of
; libm calls; -ffp-contract=fast fuses a*b+c into VFMA. Both are hot in the
; per-sample slew and grain loops. Neither changes audible behaviour.
build_flags =
    -D USBCON
    -D FILEIO_ENABLE_FATFS_READER
    -D BOOT_APP
    -mthumb
    -mfloat-abi=hard
    -mfpu=fpv5-d16
    -mcpu=cortex-m7
    -fno-math-errno
    -ffp-contract=fast
    -D USE_HAL_DRIVER
    -D USE_FULL_LL_DRIVER
    -D STM32H750xx
    -D ARM_MATH_CM7
    -I lib/libDaisy/src
    -I lib/libDaisy/src/sys
    -I lib/libDaisy/src/usbh
    -I lib/libDaisy/core
    -I lib/libDaisy/Drivers/CMSIS-DSP/Include
    -I lib/DaisySP/Source
    -I lib/DaisySP/Source/Utility
    -I lib/DaisySP/DaisySP-LGPL/Source
    -I lib/DaisySP/DaisySP-LGPL/Source/Effects

; libDaisy forces -O3 on itself via its library.json build script, so only the
; Perseids engines were left on the stm32cube default -Os. Since BOOT_SRAM the
; code budget is 480K instead of 128K, so speed is the better trade here.
build_src_flags =
    -O3

build_unflags =
    -mfpu=fpv4-sp-d16
